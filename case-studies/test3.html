<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        table,
        td {
            border: 1px solid black;
            border-collapse:collapse;
            padding: 5px;
            margin-top: 10px;
            border-radius: 5px;
        }
        td:hover{
            background-color: yellow;
        }
    </style>
  </head>
  <body>
    Enter Start Range : <input type="text" id="num1" /><br /><br />
    Enter End Range : <input type="text" id="num2" /><br /><br />
    <button onclick="myFunction()">Find</button>
    <div id="result"></div>
    <script>
      function myFunction() {
        var num1 = parseInt(document.getElementById("num1").value);
        var num2 = parseInt(document.getElementById("num2").value);
        let result ='<table>';
            result +='<tr>';
        while(num1<=num2){
            result +='<td>';
            result +='<table>';
            for (let i = 1; i <= 10; i++) {
            result += '<tr>';
            result += '<td>' + num1 + '*' + i +  '=' + num1 * i + '</td>';  
             result += '</tr>';        
            // document.getElementById("result").innerHTML +=
            //     num1 + " x " + i + " = " + num1 * i + "<br />";
          }
          result += '</table>';
          num1++;
          result +='</td>';
          
        } 
        result +='</tr>';
        result += '</table>';
        console.log(result);

        document.getElementById("result").innerHTML = result;
      }
    </script>
  </body>
</html>
