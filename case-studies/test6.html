<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Enter Your Date of Birth</h1>
        <input type="date" id="dob">
        <button onclick="calculateAge()">Calculate Age</button>
        <input type="text" id="age" readonly>
    </div>
    <script>
        let today = new Date();
        let dob = new Date(1998, 11, 17);
        console.log(today);
        console.log(Date.prototype);
        console.log('Date:',today.getDate());
        console.log('Day:',today.getDay());
        console.log('UTC Day:',today.getUTCDay());
        console.log('Month:',today.getMonth());  
        console.log('Year:',today.getFullYear());

        switch(today.getDay()){
            case 0:
                console.log('Today is Sunday');
                break;
            case 1:
                console.log('Today is Monday');
                break;
            case 2:
                console.log('Today is Tuesday');
                break;
            case 3:
                console.log('Today is Wednesday');
                break;
            case 4:
                console.log('Today is Thursday');
                break;
            case 5:
                console.log('Today is Friday');
                break;
            case 6:
                console.log('Today is Saturday');
                break;
        }

        console.log('DOB:',dob);
        console.log('DOB in dd-mm-yyyy format:',dob.getDate() + '-' + (dob.getMonth() + 1) + '-' + dob.getFullYear());
        console.log('DOB in mm/dd/yyyy format:',(dob.getMonth() + 1) + '/' + dob.getDate() + '/' + dob.getFullYear());

        age = today.getFullYear() - dob.getFullYear();
        if(today.getMonth() < dob.getMonth() || (today.getMonth() === dob.getMonth() && today.getDate() < dob.getDate())){
            age--;
        }   
        console.log('Age:',age);

        function calculateAge() {
            let dobInput = document.getElementById('dob').value;
            let dob = new Date(dobInput);
            let today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            if(today.getMonth() < dob.getMonth() || (today.getMonth() === dob.getMonth() && today.getDate() < dob.getDate())){
                age--;
            }
            document.getElementById('age').value = age;
        }   
    </script>
</body>
</html>
