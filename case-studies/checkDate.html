<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        is_date = (date) => {
            return date instanceof Date && !isNaN(date);
        }   
        console.log(is_date(new Date())); // true
        console.log(is_date(new Date('invalid date'))); // false
        console.log(is_date("October 13, 2014 11:13:00")); // false
        console.log(is_date(new Date(86400000))); // true
        console.log(is_date(new Date(99,5,24,11,33,30,0))); // true
        console.log(is_date([1, 2, 4, 0])); // false

        console.log(new Date(1000*60*60*24*360)); // Date object representing 1 Jan 1970 01:00:00

       /* 
        1 second is 1000 milliseconds
        1 minute is 60 seconds
        1 hour is 60 minutes
        1 day is 24 hours
        */

        daysInMonth = (month, year) => {
            return new Date(year, month, 0).getDate();
        }
        console.log(daysInMonth(1, 2012));
        console.log(daysInMonth(2, 2012));
        console.log(daysInMonth(2, 2013));

        // Different ways to create a Date object
        console.log(new Date()); // current date and time
        console.log(new Date(2020, 0, 1)); // January 1, 2020
        console.log(new Date(2020, 11, 31)); // December 31, 2020
        console.log(new Date('2020-01-01')); // January 1, 2020
        console.log(new Date('January 1, 2020')); // January 1, 2020
        console.log(new Date('2020-01-01T00:00:00')); // January 1, 2020 at 00:00:00
        console.log(new Date(1577836800000)); // January 1, 2020 at 00:00:00 (timestamp in milliseconds)    

    </script>
</body>
</html>
