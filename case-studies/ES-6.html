    <script>
        // ES6 (ECMAScript 2015) introduced several new features to JavaScript, including:
        // 1. let and const for block-scoped variables
        // 2. Arrow functions
        // 3. Template literals
        // 4. Destructuring assignment
        // 5. Default parameters
        // 6. Rest and spread operators
        // 7. Classes
        // 8. Modules
        // 9. Promises
        // 10. Enhanced object literals

        //1. let and const
        let x = 10; // block-scoped variable
        //let x = 15; // declaring variable with same name is not allowed
        const y =20; // block-scoped constant
        //y = 25; // error: assignment to constant variable
        /*
          let :
            - Can be reassigned
            - Cannot be redeclared in the same scope
            - Block-scoped
          const :
            - Cannot be reassigned
            - Cannot be redeclared in the same scope
            - Block-scoped
            - Must be initialized at the time of declaration

          var (pre-ES6):
            - Can be reassigned
            - Can be redeclared in the same scope
            - Function-scoped (not block-scoped)
            - Hoisted to the top of its scope (can be used before declaration, but will be undefined)
           Example:
            function example() {
                
                if (true) {
                    var a = 1; // function-scoped
                    let b = 2; // block-scoped
                    const c = 3; // block-scoped
                }
                console.log(a); // 1
                console.log(b); // ReferenceError: b is not defined
                console.log(c); // ReferenceError: c is not defined
            }
            example();

            Hoisting:
            - Hoisting is a JavaScript mechanism where variable and function declarations are 
            moved to the top of their containing scope during the compilation phase. 
            This means that you can use variables and functions before they are declared 
            in the code.
            - However, only the declarations are hoisted, not the initializations. 
            For example:
            console.log(a); // undefined (declaration is hoisted, but not the initialization)
            var a = 10; // declaration and initialization
            - With let and const, the variables are also hoisted, but they are not initialized 
            until their declaration is evaluated. 
            This means that if you try to access a let or const variable before its 
            declaration, you will get a ReferenceError:
            console.log(b); // ReferenceError: Cannot access 'b' before initialization
            let b = 20; // declaration and initialization
            - There are some best practices to avoid issues with hoisting:
            1. Always declare variables at the top of their scope to make it clear where 
            they are defined.
            2. Use let and const instead of var to avoid unintentional hoisting and to 
            take advantage of block scoping.

            - There are three types of scopes in JavaScript:
            1. Global Scope: Variables declared outside of any function or block are in the 
            global
                scope and can be accessed from anywhere in the code.

            2. Function Scope: Variables declared within a function are in the function scope 
            and can only be accessed within that function.

            3. Block Scope: Variables declared with let or const within a block (e.g
                if statement, for loop) are in the block scope and can only be accessed within 
                that block.
            
            - We can have variabe hoisting and function hoisting. Function declarations are 
            hoisted to the top of their scope, which means you can call a function before 
            it is declared in the code:
            example(); // "Hello, World!"
            function example() {
                console.log("Hello, World!");
            }

        - Disadvantage of var:
        1. Lack of block scope: Variables declared with var are function-scoped, which
        can lead to unintended consequences when used within loops or conditional statements.
        2. Hoisting issues: Variables declared with var are hoisted to the top of
        their scope, which can lead to confusion and bugs if not used carefully.
        3. Redeclaration: Variables declared with var can be redeclared within the same scope
        without throwing an error, which can lead to unintended consequences and bugs.



        ==============================
        2. Arrow functions:
        ==============================
        - Arrow functions are a concise syntax for writing function expressions in JavaScript.
        - They are defined using the => syntax and do not have their own this, arguments,
        super, or new.target bindings. They are best suited for non-method functions.

        - Function Defination Vs Function Expression:
        1. Function Definition (Function Declaration):
        - Example:
        function add(a, b) {
            return a + b;
        }
        2. Function Expression:
        - Example:
        const add = function(a, b) {
            return a + b;   
        };
        const add = (a, b) => a + b; // concise body with implicit return
        console.log(add(2, 3)); // 5


        - Task-1: Convert the following function expression to an arrow function:
        const multiply = function(x, y) {
            return x * y;
        };
        const multiply = (x, y) => x * y; // concise body with implicit return
        console.log(multiply(2, 3)); // 6

        - Task-2: Convert the following function declaration to an arrow function:
        function greet(name) {
            return `Hello, ${name}!`;
        }

        const greet = function(name){
            return `Hello, ${name}!`;
        };
        const greet = name => `Hello, ${name}!`; // concise body with implicit return
        console.log(greet("Alice")); // "Hello, Alice!"

        - Task-3 : Convert the following function expression to an arrow function:
        const numbers = [1, 2, 3, 4, 5];
        const doubled = numbers.map(function(number) {
            return number * 2;
        });
        const doubled = numbers.map(number => number * 2); // concise body with implicit return
        console.log(doubled); // [2, 4, 6, 8, 10]   



        ===============================
        3. Template literals:
        ===============================
        - Template literals are a new syntax for creating strings in JavaScript. 
        They are defined using backticks (`) and can contain placeholders for variables 
        and expressions, which are indicated by the ${} syntax.

        - Example:
        const name = "Alice";
        const greeting = `Hello, ${name}!`;
        console.log(greeting); // "Hello, Alice!"

        - Diffrence between Template Literals and String Concatenation:

        1. Syntax:
        - Template Literals: Use backticks (`) and ${} for variable interpolation.
        - String Concatenation: Use the + operator to concatenate strings and variables.

        2. Multiline Strings:
        - Template Literals: Can span multiple lines without the need for escape characters.
        - String Concatenation: Requires the use of \n for newlines and + for concatenation.

        Example:
        // Using Template Literals
        const name = "Alice";
        const greeting = `Hello, ${name}!
        Welcome to the world of JavaScript.`;
        console.log(greeting);

        // Using String Concatenation
        const name = "Alice";
        const greeting = "Hello, " + name + "!\n" +
                         "Welcome to the world of JavaScript.";


        ================================
        4. Destructuring assignment:
        ================================
        - What is destructuring assignment in JavaScript?
        - Destructuring assignment is a syntax in JavaScript that allows you to unpack 
        values from arrays or properties from objects into distinct variables.
        - Example:
        // Array destructuring
        const numbers = [1, 2, 3];
        // let a = numbers[0];
        // let b = numbers[1];
        // let c = numbers[2];
        const [a, b, c] = numbers;
        console.log(a, b, c); // 1 2 3

        // Object destructuring
        const person = { name: "Alice", age: 25 };
        console.log(person.name, person.age); // "Alice" 25
        const { name, age } = person;
        console.log(name, age); // "Alice" 25
        const { name: x, age: y } = person;
        console.log(x, y); // "Alice" 25

        Advance Example-1 :

        const person = {
            name: "Alice",
            age: 25,
            address: {
                city: "New York",
                country: "USA"
            }
        };
        const { name, age, address: { city, country } } = person;
        console.log(name, age, city, country); // "Alice" 25 "New York" "USA"

        Advance Example-2:
        const numbers = [1, 2, 3, 4, 5];
        const [first, second, ...rest] = numbers;
        console.log(first); // 1
        console.log(second); // 2
        console.log(rest); // [3, 4, 5]


        Advance Example-3:
        const person = {
            name: "Alice",
            age: 25,
            hobbies: ["reading", "traveling", "cooking"]
        };  
        const { name, age, hobbies: [firstHobby, secondHobby] } = person;
        console.log(name); // "Alice"
        console.log(age); // 25
        console.log(firstHobby); // "reading"
        console.log(secondHobby); // "traveling"

        // How can you take third element of an array using destructuring assignment by skipping first two elements?
        // Answer: By using commas to skip the first two elements.
        const numbers = [1, 2, 3, 4, 5];
        const [ , , third] = numbers;
        console.log(third); // 3

        ================================
        5. Default parameters:
        ================================
        - Default parameters allow you to specify default values for function parameters.
        - If a parameter is not provided when the function is called, the default value will 
        be used.
        - Example:
        function greet(name="guest") {
            return `Hello, ${name}!`;
        }
        console.log(greet()); // "Hello, guest!"
        console.log(greet("Alice")); // "Hello, Alice!"

        Example:

         function div(a, b) {
            return a / b;   
         }
       
         console.log(div(10, 2)); // 5
         console.log(div(10)); // NaN (b is undefined)
         console.log(div()); // NaN (a and b are undefined)

         function div(a=0, b=1) {
            return a / b;   
         }

         console.log(div(10, 2)); // 5
         console.log(div(10)); // 10 (b uses default value 1)
         console.log(div()); // 0 (a uses default value 0, b uses default value 1)


        ========================================
         6. Rest and spread operators:
        ========================================

          - Rest operator allows you to represent an indefinite number of arguments as an array.
          - Spread operator allows you to expand an array or object into individual elements 
            or properties.
          - Example of Rest operator:

            Create a function that takes any number of arguments and returns their sum using 
            the rest operator.

            function sum(num1,num2){
                return num1 + num2;
            }

            consle.log(sum(1, 2)); // 3
            console.log(sum(1, 2, 3)); // 3 (only first two arguments are considered)

            function sum(...numbers) {
                    console.log(numbers); // [1, 2], [1, 2, 3], [1, 2, 3, 4] ,[]
                    return numbers.reduce((acc, curr) => acc + curr, 0);
      }
    
                console.log(sum(1, 2)); // 3
                console.log(sum(1, 2, 3)); // 6
                console.log(sum(1, 2, 3, 4)); // 10
                console.log(sum()); // 0 (no arguments, returns the initial value of 0) 


        Spread operator examples:

        //Array Spreading:

        const arr1 = [1, 2, 3];
        const arr2 = [4, 5, 6];
        const combined = [...arr1, ...arr2];
        console.log(combined); // [1, 2, 3, 4, 5, 6]

        //Object Spreading:
        const obj1 = { a: 1, b: 2 };
        const obj2 = { c: 3, d: 4 };
        const combinedObj = { ...obj1, ...obj2 };
        console.log(combinedObj); // { a: 1, b: 2, c: 3, d: 4 }


        // Function Arguments Spreading:
        function sum(a, b, c) {
            return a + b + c;
        }
        const numbers = [1, 2, 3];
        console.log(sum(...numbers)); // 6 (spreads the array into individual arguments)

        // String Spreading:
        const str = "Hello";
        const chars = [...str];
        console.log(chars); // ['H', 'e', 'l', 'l', 'o']

        // Example of using spread operator to create a new array with additional elements:
        const originalArray = [1, 2, 3];
        const newArray = [...originalArray, 4, 5];
        console.log(newArray); // [1, 2, 3, 4, 5]   

        // Example of using spread operator to create a new object with additional properties:
        const originalObject = { a: 1, b: 2 };
        const newObject = { ...originalObject, c: 3, d: 4 };
        console.log(newObject); // { a: 1, b: 2, c: 3, d: 4 }

        // Example of using rest operator to collect remaining arguments into an array:
        function collectArgs(first, second, ...rest) {
            console.log(first); // 1
            console.log(second); // 2
            console.log(rest); // [3, 4, 5]
        }
        collectArgs(1, 2, 3, 4, 5);

        // Real time example of using rest operator to create a function that accepts any 
        // number of arguments and returns their product:
        function product(...numbers) {
            return numbers.reduce((acc, curr) => acc * curr, 1);
        }
        console.log(product(2, 3)); // 6
        console.log(product(2, 3, 4)); // 24

        // Add Extra properties to an Employee object using spread operator:
        const employee = {
            name: "John Doe",
            position: "Software Engineer"
        };
        const updatedEmployee = {
            ...employee,
            department: "Engineering",
            salary: 80000
        }; 
        console.log(updatedEmployee);   // { name: "John Doe", position: "Software Engineer", department: "Engineering", salary: 80000 }

         const updatedPerson = {

         ====================================================
            7. Classes: 
        ====================================================
        - Classes are a syntactical sugar over JavaScript's existing prototype-based 
        inheritance.

        - Example:
        class Person {
            constructor(name, age) {
                this.name = name;
                this.age = age;
            }

            greet() {
                return `Hello, my name is ${this.name} and I am ${this.age} years old.`;
            }
        }

        const person1 = new Person("Alice", 30);
        console.log(person1.greet()); // "Hello, my name is Alice and I am
        30 years old."


        //Inheritance in ES6 Classes:
        - ES6 classes support inheritance through the use of the extends keyword.
        - The subclass can call the parent class constructor using the super() function, and
        can also override methods from the parent class.
        - Types of Inheritance supported in ES6:
        1. Single Inheritance: A subclass inherits from a single parent class.
        2. Multilevel Inheritance: A subclass inherits from a parent class, which in turn
        inherits from another parent class.
        3. Hierarchical Inheritance: Multiple subclasses inherit from a single parent class.
       
        - NOTE:
          Multiple Inheritance (where a class can inherit from more than one parent class) 
          is not supported in ES6.

        //Inheritance Example:
        class Employee extends Person {
            constructor(name, age, position) {
                super(name, age); // Call the parent class constructor
                this.position = position;
            }
            work() {
                return `${this.name} is working as a ${this.position}.`;
            }

        }

        const employee1 = new Employee("Bob", 25, "Software Engineer");
        console.log(employee1.greet()); // "Hello, my name is Bob and I am 25 years old."
        console.log(employee1.work()); // "Bob is working as a Software Engineer."

        // Static Method Example:
        class MathUtils {
            static add(a, b) {
                return a + b;
            }
        }   
        console.log(MathUtils.add(5, 10)); // 15 (static method can be called without 
        // creating an instance of the class)


        // Getters and Setters Example:
        class Rectangle {
            constructor(width, height) {
                this.width = width;
                this.height = height;
            }

            get area() {
                return this.width * this.height;
            }

            set area(value) {
                const ratio = Math.sqrt(value / (this.width * this.height));
                this.width *= ratio;
                this.height *= ratio;
            }
        }


        // Create a rectangle with width 4 and height 2
        const rect = new Rectangle(4, 2);
        console.log(rect.area); // 8 (area is calculated using the getter)
        rect.area = 32; // Set a new area using the setter
        console.log(rect.width); // 8 (width is updated based on the new area)
        console.log(rect.height); // 8 (height is updated based on the new area)

        // Method OverLoading vs Method OverRiding:
        // Method Overloading:
        class Calculator {
            add(a, b) {
                return a + b;
            }

            add(a, b, c) {
                return a + b + c;
            }
        }

        // Method Overriding:
        class Animal {
            speak() {
                return "Animal makes a sound";
            }
        }
        class Dog extends Animal {
            speak() {
                return "Dog barks";
            }
        }

         const dog = new Dog();
         console.log(dog.speak()); // "Dog barks" (the speak method is overridden in 
         // the Dog class)


      // Real-time example of using classes to create a simple bank account system:
      class BankAccount {

        constructor(accountNumber, accountHolder, balance = 0) {
            this.accountNumber = accountNumber;
            this.accountHolder = accountHolder;
            this.balance = balance;
        }

        deposit(amount) {
            if (amount > 0) {
                this.balance += amount;
                return `Deposited ${amount}. New balance: ${this.balance}`;
            } else {
                return "Deposit amount must be positive.";
            }
        }

        withdraw(amount) {
            if (amount > 0 && amount <= this.balance) {
                this.balance -= amount;
                return `Withdrew ${amount}. New balance: ${this.balance}`;
            } else {
                return "Withdrawal amount must be positive and less than or equal to the balance.";
            }
        }

        getBalance() {
            return `Current balance: ${this.balance}`;
        }
      } 
        const account1 = new BankAccount("123456789", "Alice");
        console.log(account1.getBalance()); // "Current balance: 0"
        console.log(account1.deposit(100)); // "Deposited 100. New balance:
        100"
        console.log(account1.withdraw(30)); // "Withdrew 30. New balance: 70"
        console.log(account1.withdraw(100)); // "Withdrawal amount must be positive and less than or equal to the balance."
